[package]
name = "envoke"
version = "1.0.0"
edition = "2024"
description = "Switch .env profiles and run your dev server in a Neovim-style terminal workspace"
license = "GPL-3.0-or-later"
authors = ["Sabbir Ahamed Maruf <sabbirahamedmaruf03@gmail.com>"]
repository = "https://github.com/SabbirAhamedMaruf/Envoke"
homepage = "https://github.com/SabbirAhamedMaruf/Envoke"
readme = "README.md"

[dependencies]
anyhow = "1"
crossterm = "0.29"
directories = "6"
fs2 = "0.4"
nix = { version = "0.30", features = ["signal", "process", "term"] }
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
toml = "0.9"
unicode-width = "0.2"
vt100 = "0.18"

[profile.release]
lto = "thin"
strip = true

[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/release/envoke", dest = "/usr/bin/envoke", mode = "0755" },
    { source = "README.md", dest = "/usr/share/doc/envoke/README.md", mode = "0644", doc = true },
    { source = "KEYBINDINGS.md", dest = "/usr/share/doc/envoke/KEYBINDINGS.md", mode = "0644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/envoke/LICENSE", mode = "0644" },
]

# Installing envoke replaces the package it was renamed from.
[package.metadata.generate-rpm.obsoletes]
env-management = "*"

# Read by scripts/build-deb.py; Depends is worked out from the binary itself.
[package.metadata.deb]
revision = "1"
copyright = "2026 Sabbir Ahamed Maruf"
section = "utils"
priority = "optional"
extended-description = """\
A terminal workspace for project environment profiles. Pick a project, preview \
its .env files, and run its dev server with the one you choose, in a real \
terminal pane. Vim-style modes, a : command line, NvChad themes and a keymap \
file you can change."""
assets = [
    { source = "target/release/envoke", dest = "/usr/bin/envoke", mode = "0755" },
    { source = "README.md", dest = "/usr/share/doc/envoke/README.md", mode = "0644" },
    { source = "KEYBINDINGS.md", dest = "/usr/share/doc/envoke/KEYBINDINGS.md", mode = "0644" },
]
